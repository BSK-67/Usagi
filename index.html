<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우사기의 집</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#fff6d6;--bg2:#ffe3ec;--ink:#5a3a2e;--card:#ffffffcc;--btn:#fff;--bar:#ffd1dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3b3326;--bg2:#3d2a33;--ink:#ffeede;--card:#2a2024cc;--btn:#4a3640;--bar:#8a5a6c}}
:root[data-theme="dark"]{--bg1:#3b3326;--bg2:#3d2a33;--ink:#ffeede;--card:#2a2024cc;--btn:#4a3640;--bar:#8a5a6c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);
background:radial-gradient(circle at 20% 10%,var(--bg1),transparent 60%),var(--bg2);display:flex;flex-direction:column;align-items:center;padding:12px}
h1{margin:6px 0 2px;font-size:1.5rem}
.sub{margin:0 0 8px;font-size:.9rem;opacity:.8;text-align:center}
.hud{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:8px 14px;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
.bar{width:110px;height:12px;background:var(--bar);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#ff8fab;width:100%;transition:width .2s}
svg{width:100%;max-width:680px;height:auto;cursor:pointer;touch-action:manipulation}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:680px}
button{font:inherit;color:var(--ink);background:var(--btn);border:2px solid #ffb6c9;border-radius:14px;padding:9px 14px;cursor:pointer}
button:active{transform:scale(.96)}
button small{opacity:.7}
.log{margin-top:8px;font-size:.85rem;opacity:.8}
.shop{margin-top:12px;max-width:680px;width:100%;background:var(--card);border-radius:16px;padding:8px 12px}.shop h2{margin:4px 0 8px;font-size:1.05rem}.grid{display:flex;gap:8px;flex-wrap:wrap}button:disabled{opacity:.45;cursor:default}</style>
</head>
<body>
<h1>🐰 우사기의 집</h1>
<p class="sub">바닥을 눌러 걷게 하거나, 아래 버튼으로 일을 시켜보세요. 우사기를 누르면 “야하!”</p>
<div class="hud">
  <span>🪙 <b id="coins">0</b></span>
  <span>체력 <span class="bar" style="display:inline-block;vertical-align:middle"><i id="en"></i></span></span>
  <label style="font-size:.85rem"><input type="checkbox" id="wander" checked> 알아서 돌아다니기</label>
</div>
<svg id="sc" viewBox="0 0 640 470"></svg>
<div class="btns">
  <button data-j="weed">🌱 잡초 뽑기 <small>+15🪙</small></button>
  <button data-j="clean">🧹 청소 <small>+10🪙</small></button>
  <button data-j="cook">🍳 요리 <small>+25🪙</small></button>
  <button data-j="rest">🛏️ 쉬기</button>
</div>
<div class="shop" id="shop"></div>
<div class="log" id="log">우사기가 일을 기다리고 있어요.</div>
<script>
const TW=36,TH=18,ZS=34,OX=320,OY=150,svg=document.getElementById('sc');
const P=(x,y,z=0)=>[OX+(x-y)*TW,OY+(x+y)*TH-z*ZS];
const S='stroke="#8b5e4b" stroke-width="1" stroke-linejoin="round"';
const poly=(pts,f,e=S)=>`<polygon points="${pts.map(p=>P(...p).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="${f}" ${e}/>`;
const box=(x,y,w,d,h,c,z=0)=>
 poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],c[1])+
 poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],c[2])+
 poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],c[0]);
const WOOD=['#ffe0a8','#f0c088','#dca56c'],PINK=['#ffd1dc','#f7a8bd','#ee93ac'],CREAM=['#fffbe6','#f3e6b5','#e6d79e'],YEL=['#fff0a0','#f2d96a','#e5c850'];
const carrot=(p,s=1)=>`<g transform="translate(${p[0]},${p[1]-4*s}) scale(${s})"><path d="M-6 -4L6 -4L0 14Z" fill="#ff9a3c" ${S}/><path d="M-3 -4L-4 -11L0 -6L4 -11L3 -4Z" fill="#7ccf6e" ${S}/></g>`;
const tuft=p=>`<g transform="translate(${p[0]},${p[1]})"><path d="M-6 0L-4 -10L0 -2L2 -12L6 0Z" fill="#59b84f" ${S}/></g>`;
const dust=p=>`<g transform="translate(${p[0]},${p[1]})" fill="#c9c2bd" ${S}><ellipse cx="0" cy="-3" rx="9" ry="4"/><ellipse cx="6" cy="-6" rx="5" ry="3"/><ellipse cx="-6" cy="-7" rx="4" ry="2.5"/></g>`;

// ---- static scene ----
const OL='stroke="#6b3f33" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"';
const MINT=['#d8f5e0','#b5e6c5','#9fd9b3'];const BLUE=['#d6efff','#b3dcf5','#98cdea'];
const ring=(cx,cy,r,z,a0=0,a1=6.2832,n=28)=>{const a=[];for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n;a.push([cx+r*Math.cos(t),cy+r*Math.sin(t),z])}return a};
const cyl=(cx,cy,r,h,c,z=0)=>poly(ring(cx,cy,r,z,-.785,2.356,14).concat(ring(cx,cy,r,z+h,-.785,2.356,14).reverse()),c[1],OL)+poly(ring(cx,cy,r,z+h,0,6.2832,28),c[0],OL);

const ell=(x,y,z,rx,ry,f,rot=0)=>{const q=P(x,y,z);return `<ellipse cx="${f1(q[0])}" cy="${f1(q[1])}" rx="${rx}" ry="${ry}" fill="${f}" ${OL} transform="rotate(${rot} ${f1(q[0])} ${f1(q[1])})"/>`};
const dot=(x,y,z,r,f,o='')=>{const q=P(x,y,z);return `<circle cx="${f1(q[0])}" cy="${f1(q[1])}" r="${r}" fill="${f}" ${o}/>`};
const fl=(x,y,c)=>{const q=P(x,y);let r='';for(let i=0;i<5;i++){const a=i*1.2566;r+=`<circle cx="${f1(q[0]+Math.cos(a)*3.2)}" cy="${f1(q[1]-2+Math.sin(a)*2)}" r="2.4" fill="${c}"/>`}return r+`<circle cx="${f1(q[0])}" cy="${f1(q[1]-2)}" r="1.8" fill="#ffd54a"/>`};

for(let r=0,z=1.6;z<3.8;z+=.5,r++)for(let x=r%2?.45:.85;x<8;x+=.8){st+=dot(x,0,z,2.3,'rgba(255,150,180,.42)')+dot(0,x,z,2.3,'rgba(255,150,180,.42)')}

st+=poly([[3.25,0,3.55],[5.75,0,3.55]],'none',OL)+poly([[3.3,0,1.5],[3.95,0,1.5],[3.85,0,3.5],[3.3,0,3.5]],'#ffc0d0',OL)+poly([[5.05,0,1.5],[5.7,0,1.5],[5.7,0,3.5],[5.1,0,3.5]],'#ffc0d0',OL);
st+=`<path d="M${P(3.5,0,1.6)}L${P(3.55,0,3.4)}M${P(3.7,0,1.6)}L${P(3.7,0,3.4)}M${P(5.3,0,1.6)}L${P(5.3,0,3.4)}M${P(5.5,0,1.6)}L${P(5.55,0,3.4)}" stroke="#e58fab" fill="none"/>`;
st+=lights();
// bunny clock
{const q=P(6.9,0,3.15);st+=`<ellipse cx="${f1(q[0]-6)}" cy="${f1(q[1]-17)}" rx="4" ry="9" fill="#ffc0d0" ${OL} transform="rotate(-14 ${f1(q[0]-6)} ${f1(q[1]-17)})"/><ellipse cx="${f1(q[0]+6)}" cy="${f1(q[1]-17)}" rx="4" ry="9" fill="#ffc0d0" ${OL} transform="rotate(14 ${f1(q[0]+6)} ${f1(q[1]-17)})"/><circle cx="${f1(q[0])}" cy="${f1(q[1])}" r="15" fill="#fff" ${OL}/><path d="M${f1(q[0])} ${f1(q[1])}L${f1(q[0])} ${f1(q[1]-9)}M${f1(q[0])} ${f1(q[1])}L${f1(q[0]+6)} ${f1(q[1]+2)}" stroke="#6b3f33" stroke-width="1.8" stroke-linecap="round"/><circle cx="${f1(q[0]-5)}" cy="${f1(q[1]+5)}" r="2.2" fill="#ffb6c9"/><circle cx="${f1(q[0]+8)}" cy="${f1(q[1]+5)}" r="2.2" fill="#ffb6c9"/>`}
// left wall: door, frames, mat
st+=poly([[0,5,0],[0,6.8,0],[0,6.8,2.9],[0,5,2.9]],'#e9b07e',OL)+poly([[0,5.2,.2],[0,6.6,.2],[0,6.6,1.4],[0,5.2,1.4]],'#f6c9a0',OL)+poly([[0,5.2,1.6],[0,6.6,1.6],[0,6.6,2.7],[0,5.2,2.7]],'#f6c9a0',OL)+dot(0,6.5,1.5,3,'#fff',OL);
st+=poly([[0,1.4,1.9],[0,2.7,1.9],[0,2.7,3.2],[0,1.4,3.2]],'#fff',OL)+poly([[0,1.5,2],[0,2.6,2],[0,2.6,3.1],[0,1.5,3.1]],'#ffd6e0',OL)+carrot(P(0,2.05,2.55),1);
st+=poly([[0,3.1,2.3],[0,3.9,2.3],[0,3.9,3.1],[0,3.1,3.1]],'#fff',OL)+poly([[0,3.2,2.4],[0,3.8,2.4],[0,3.8,3],[0,3.2,3]],'#d6efff',OL)+dot(0,3.5,2.7,5,'#ffe27a',OL);
st+=poly([[.3,5.2,0],[1.4,5.2,0],[1.4,6.6,0],[.3,6.6,0]],'#ffb6c9',OL);
// rug
const rg=ring(4.75,4.75,2.3,0,0,6.2832,28);
st+=poly(rg,'#ffc2d2',OL)+poly(rg.map(p=>[4.75+(p[0]-4.75)*.82,4.75+(p[1]-4.75)*.82,0]),'#fff3c4','stroke="#ffb0c4" stroke-width="1.5" stroke-dasharray="4 3"')+poly(rg.map(p=>[4.75+(p[0]-4.75)*.4,4.75+(p[1]-4.75)*.4,0]),'#ffd9e4','stroke="none"');
// garden
st+=poly([[6,5.2,0],[8,5.2,0],[8,7.5,0],[6,7.5,0]],'#9be08a',OL)+poly([[6.2,5.4,0],[7.8,5.4,0],[7.8,7.3,0],[6.2,7.3,0]],'#b98a62',OL);
[5.9,6.5,7.1].forEach(y=>st+=`<path d="M${P(6.3,y)}L${P(7.7,y)}" stroke="#a47750" stroke-width="2"/>`);
st+=fl(6.1,5.3,'#ff9fb8')+fl(7.9,5.3,'#fff')+fl(6.1,7.45,'#9fdcff')+fl(7.9,7.45,'#ff9fb8')+fl(7.9,6.4,'#ffd54a');

const WEEDS=[[6.6,5.9],[7.3,6.2],[6.8,6.8],[7.5,5.7]],DUST=[[1.2,6.4],[2.2,5.5],[2.5,6.9]];
let weeds=true,dusty=true;
const dotsOn=(x0,y0,x1,y1,z,c)=>{let o='';for(let x=x0;x<x1;x+=.45)for(let y=y0;y<y1;y+=.45)o+=dot(x,y,z,1.6,c);return o};

const plush=(x,y,z=0,k=1)=>{const q=P(x,y,z);return `<g transform="translate(${f1(q[0])},${f1(q[1])}) scale(${k})"><ellipse cx="-7" cy="-44" rx="4.5" ry="12" fill="#fff2bd" ${OL}/><ellipse cx="7" cy="-44" rx="4.5" ry="12" fill="#fff2bd" ${OL}/><ellipse cx="-7" cy="-44" rx="2" ry="8" fill="#ffc0d0"/><ellipse cx="7" cy="-44" rx="2" ry="8" fill="#ffc0d0"/><ellipse cx="0" cy="-17" rx="20" ry="18" fill="#fff2bd" ${OL}/><circle cx="-7" cy="-21" r="2" fill="#2a1715"/><circle cx="7" cy="-21" r="2" fill="#2a1715"/><ellipse cx="-12" cy="-15" rx="4" ry="2.5" fill="#f6b4c4"/><ellipse cx="12" cy="-15" rx="4" ry="2.5" fill="#f6b4c4"/><path d="M-2.5 -16q2.5 3 5 0" stroke="#6b3f33" fill="none"/></g>`};
const items=[
 {b:[.15,2.45,.4,3.6],s:box(.15,.4,2.3,3.2,.45,WOOD)+box(.15,.4,2.3,.22,1.15,['#ffe0a8','#f0c088','#dca56c'])+box(.25,.65,2.1,2.8,.3,CREAM,.45)+box(.22,1.5,2.16,2.0,.34,PINK,.45)+dotsOn(.4,1.7,2.3,3.4,.79,'rgba(255,255,255,.75)')+box(.22,1.5,2.16,.28,.36,CREAM,.45)+box(.45,.7,.85,.7,.22,['#fff','#ffe9ef','#ffd3de'],.75)+box(1.4,.7,.85,.7,.22,['#fffbe6','#f3e6b5','#e6d79e'],.75)+carrot(P(1.9,2.9,.85),1.2)},
 {b:[2.5,3.3,.2,.9],s:box(2.5,.2,.8,.7,.7,WOOD)+`<path d="M${P(2.5,.9,.4)}L${P(3.3,.9,.4)}" stroke="#6b3f33"/>`+cyl(2.9,.55,.07,.35,['#fff','#eee'],.7)+cyl(2.9,.55,.2,.3,['#fff3b0','#ffe27a'],1.05)},

 weed:{n:'잡초 뽑기',sp:[6.9,6.2],d:3.2,r:15,c:20,em:'🌱',ex:'우라라라!',ok:()=>weeds=false,need:()=>weeds},
 clean:{n:'청소',sp:[1.8,6.2],d:2.6,r:10,c:12,em:'🧹',ex:'푸랴푸랴~',ok:()=>dusty=false,need:()=>dusty},

const log=t=>document.getElementById('log').textContent=t;
function talk(t,s=2.2){U.say=t;U.sayT=s}
function go(x,y,then){U.tx=Math.max(.5,Math.min(7.5,x));U.ty=Math.max(1.3,Math.min(7.5,y));U.then=then||null;U.mode='walk';U.job=null}
function doJob(k){
 if(U.mode==='work'||U.job){talk('야하?!');return}
 if(k==='rest'){go(1.3,2.3,()=>{U.mode='rest';U.z=.75;talk('Zzz...',99);log('우사기가 침대에서 쉬는 중…')});return}
 const j=JOBS[k];
 if(U.en<j.c){talk('푸루푸루…');log('체력이 부족해요. 쉬게 해주세요!');return}
 if(!j.need()){talk('야하!');log('조금 있으면 또 생겨요.');return}
 talk('우라!',1.4);log(j.n+' 하러 가는 중…');
 go(j.sp[0],j.sp[1],()=>{U.mode='work';U.job=j;U.t=0});U.job=j;
}
document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>doJob(b.dataset.j));
svg.addEventListener('pointerdown',e=>{
 const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*640/r.width,sy=(e.clientY-r.top)*470/r.height;
 const up=P(U.x,U.y,U.z);
 if(Math.hypot(sx-up[0],sy-(up[1]-30))<36){talk(['야하!','우라!','하?','푸루푸루','하야하!'][Math.random()*5|0],1.6);U.hop=.4;return}
 if(U.mode==='work')return;
 if(U.mode==='rest'){U.z=0;U.mode='idle'}
 const a=(sx-OX)/TW,b=(sy-OY)/TH;go((a+b)/2,(b-a)/2);
});
let last=performance.now(),idleT=0;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(U.mode==='walk'){
  const dx=U.tx-U.x,dy=U.ty-U.y,d=Math.hypot(dx,dy),sp=2.6*dt;
  if(Math.abs(dx-dy)>.01)U.face=(dx-dy)>0?1:-1;
  if(d<=sp){U.x=U.tx;U.y=U.ty;U.mode='idle';const f=U.then;U.then=null;if(f)f()}else{U.x+=dx/d*sp;U.y+=dy/d*sp}
  U.wt+=dt*14;
 }else if(U.mode==='work'){
  U.t+=dt;U.wt+=dt*9;
  if(U.t>=U.job.d){const j=U.job;U.en=Math.max(0,U.en-j.c);U.coins+=j.r;j.ok();U.job=null;U.mode='idle';talk('야하! +'+j.r+'🪙',2);log(j.n+' 끝! '+j.r+'코인 벌었어요.');U.hop=.5;
   if(!weeds)setTimeout(()=>weeds=true,9000);if(!dusty)setTimeout(()=>dusty=true,9000);}
 }else if(U.mode==='rest'){U.en=Math.min(100,U.en+dt*14);if(U.en>=100){U.z=0;U.mode='idle';talk('우라~!');log('체력이 가득 찼어요!')}}
 else{
  idleT+=dt;
  if(idleT>5+Math.random()*3){idleT=0;if(document.getElementById('wander').checked){go(1+Math.random()*6.2,1.5+Math.random()*5.5);if(Math.random()<.4)talk(['하?','야하~','푸루푸루','우라!'][Math.random()*4|0],1.5)}}
 }
 if(U.sayT>0&&U.mode!=='rest')U.sayT-=dt;if(U.hop>0)U.hop-=dt;
 document.getElementById('coins').textContent=U.coins;if(U.coins!==shownC){shownC=U.coins;renderShop();save()}document.getElementById('en').style.width=U.en+'%';
 draw();requestAnimationFrame(frame);
}

const SC=.62,POSE={weed:'flower',clean:'can',cook:'pot'};
function usagi(){
 const p=P(U.x,U.y,U.z),wk=U.mode==='walk',bob=wk?-Math.abs(Math.sin(U.wt))*5:U.mode==='work'?-Math.abs(Math.sin(U.wt))*2:U.hop>0?-Math.sin(U.hop/.5*3.14)*14:0;
 let n='stand',rot=0;
 if(wk){n=Math.sin(U.wt)>0?'jump':'wand';rot=Math.sin(U.wt*.5)*4}
 else if(U.mode==='work'){n=POSE[Object.keys(JOBS).find(k=>JOBS[k]===U.job)]||'stand';rot=Math.sin(U.wt)*4}
 else if(U.mode==='rest')n='lie';
 else if(U.hop>0){if(U.hop>.38||!U.hp)U.hp=['snack','wind','tomato','orange'][Math.random()*4|0];n=U.hp}
 const v=SPR[n],w=v[1],h=v[2];
 let g=`<g transform="translate(${p[0]},${p[1]+bob})"><ellipse cx="0" cy="${-bob}" rx="${w*SC*.38}" ry="6" fill="rgba(0,0,0,.13)"/><g transform="scale(${U.face*SC},${SC}) rotate(${rot}) translate(${-w/2},${-h+4})"><use href="#s_${n}"/></g>`;
 if(U.mode==='work'){g+=`<text x="0" y="-112" font-size="24" text-anchor="middle" transform="rotate(${Math.sin(U.wt)*14} 0 -112)">${U.job.em}</text><rect x="-26" y="-104" width="52" height="7" rx="3.5" fill="#fff" ${S}/><rect x="-26" y="-104" width="${52*U.t/U.job.d}" height="7" rx="3.5" fill="#ff8fab"/>`}
 g+='</g>';
 if(U.sayT>0){const tw=U.say.length*13+20,yy=U.mode==='work'?-140:-112;g+=`<g transform="translate(${p[0]},${p[1]+yy})"><rect x="${-tw/2}" y="-24" width="${tw}" height="28" rx="12" fill="#fff" ${S}/><path d="M-5 4L0 11L5 4Z" fill="#fff" ${S}/><text y="-4" text-anchor="middle" font-size="14" fill="#5a3a2e">${U.say}</text></g>`}
 return g;
}
const dyn=document.createElementNS('http://www.w3.org/2000/svg','g');
svg.innerHTML='<g>'+st+'</g>';svg.appendChild(dyn);svg.insertAdjacentHTML('afterbegin','<defs>'+Object.entries(SPR).map(([k,v])=>`<image id="s_${k}" href="data:image/png;base64,${v[0]}" width="${v[1]}" height="${v[2]}"/>`).join('')+'</defs>');
const OWNED=new Set();let shownC=-1;
const SHOP=[
 {id:'plant',n:'작은 화분',em:'🪴',p:15,b:[2.85,3.35,2.15,2.65],s:()=>cyl(3.1,2.4,.22,.3,MINT)+[-25,0,25].map(a=>ell(3.1+a/120,2.4,.75,4,10,'#7ccf6e',a)).join('')},
 {id:'lamp',n:'당근 스탠드',em:'🥕',p:20,b:[.65,1.15,6.75,7.25],s:()=>cyl(.9,7,.22,.1,['#ffe3b5','#f0c088'])+box(.86,6.96,.08,.08,1.6,WOOD,.1)+cyl(.9,7,.3,.4,['#ffb86b','#ff9a3c'],1.7)+ell(.9,7,2.2,3,7,'#7ccf6e')},
 {id:'bean',n:'토끼 빈백',em:'🛋️',p:35,b:[1.7,2.9,6.3,7.5],s:()=>cyl(2.3,6.9,.6,.5,['#fff2bd','#f0dd9a'])+ell(2.15,6.9,.62,3.5,8,'#ffc0d0',-12)+ell(2.45,6.9,.62,3.5,8,'#ffc0d0',12)},
 {id:'big',n:'큰 토끼 인형',em:'🧸',p:50,b:[5.6,6.6,2.5,3.5],s:()=>plush(6.1,3.0,0,1.5)},
 {id:'game',n:'미니 TV',em:'📺',p:70,b:[6.9,7.6,3.7,4.4],s:()=>box(6.9,3.7,.7,.7,.5,BLUE)+pl4(6.95,7.55,.12,.42)+carrot(P(7.25,4.4,.28),.5)}
];
const pl4=(x0,x1,z0,z1)=>poly([[x0,4.4,z0],[x1,4.4,z0],[x1,4.4,z1],[x0,4.4,z1]],'#fffbe6',OL);
try{const sv=JSON.parse(localStorage.getItem('usagi-save')||'{}');U.coins=sv.coins||0;(sv.owned||[]).forEach(i=>OWNED.add(i))}catch(e){}
function save(){try{localStorage.setItem('usagi-save',JSON.stringify({coins:U.coins,owned:[...OWNED]}))}catch(e){}}
function renderShop(){const el=document.getElementById('shop');
 el.innerHTML='<h2>🛍️ 가구 상점</h2><div class="grid">'+SHOP.map(i=>{const o=OWNED.has(i.id);return `<button data-b="${i.id}" ${o||U.coins<i.p?'disabled':''}>${i.em} ${i.n}<br><small>${o?'보유 중 ✅':i.p+'🪙'}</small></button>`}).join('')+'</div>';
 el.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>buy(b.dataset.b))}
function buy(id){const i=SHOP.find(x=>x.id===id);if(!i||OWNED.has(id)||U.coins<i.p)return;U.coins-=i.p;OWNED.add(id);talk('우라!',1.8);U.hop=.5;log(i.n+' 샀어요! 방에 놓았어요.');save();renderShop()}
const bnd=(x,y,r=.25)=>[x-r,x+r,y-r,y+r];
function order(l){
 const n=l.length,c=l.map(i=>(i.b[0]+i.b[1]+i.b[2]+i.b[3])/2+(i.bias||0)),after=Array.from({length:n},()=>[]),deg=Array(n).fill(0);
 for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=l[i].b,b=l[j].b,e=.001,ab=a[1]<=b[0]+e||a[3]<=b[2]+e,ba=b[1]<=a[0]+e||b[3]<=a[2]+e;
  const first=ab&&!ba?true:ba&&!ab?false:c[i]<c[j];
  if(first){after[i].push(j);deg[j]++}else{after[j].push(i);deg[i]++}}
 const out=[],done=Array(n).fill(false);
 for(let k=0;k<n;k++){let best=-1;
  for(let i=0;i<n;i++)if(!done[i]&&deg[i]===0&&(best<0||c[i]<c[best]))best=i;
  if(best<0)for(let i=0;i<n;i++)if(!done[i]&&(best<0||c[i]<c[best]))best=i;
  done[best]=true;out.push(l[best]);after[best].forEach(j=>deg[j]--)}
 return out}
function draw(){
 const l=items.slice();
 SHOP.forEach(i=>{if(OWNED.has(i.id))l.push({b:i.b,s:i.s()})});
 if(weeds)WEEDS.forEach(w=>l.push({b:bnd(w[0],w[1],.15),s:tuft(P(w[0],w[1]))}));
 if(dusty)DUST.forEach(w=>l.push({b:bnd(w[0],w[1],.15),s:dust(P(w[0],w[1]))}));
 l.push({b:bnd(U.x,U.y,.25),bias:U.mode==='rest'?.6:0,s:usagi()});
 dyn.innerHTML=order(l).map(i=>i.s).join('');
}
